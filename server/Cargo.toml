[package]
name = "persist-sync-server"
version = "0.1.0"
edition = "2021"
description = "Persist sync server — relays the desktop's public projection into the PostgreSQL mirror"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }

sqlx = { version = "0.8", default-features = false, features = [
    "postgres", "runtime-tokio", "macros", "chrono", "rust_decimal",
] }
rust_decimal = { version = "1", features = ["serde-float"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
