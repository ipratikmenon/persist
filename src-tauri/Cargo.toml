[package]
name = "persist"
version = "0.1.0"
description = "Persist Desktop — Persistas & Partners legal practice management"
authors = ["Persistas & Partners"]
edition = "2021"

[lib]
name = "persist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "persist"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
keyring = "3"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
bcrypt = "0.15"
tempfile = "3"

[dev-dependencies]

[features]
# Production build disables devtools
custom-protocol = ["tauri/custom-protocol"]
integration = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
